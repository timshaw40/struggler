# The deep bot's engine: build DeepStruggle's rules (the pinned
# third_party/deepstruggle submodule) plus our shim as one WebAssembly module,
# then prove it loads and agrees with struggler on Windows, macOS and Linux.
name: deep-engine

on:
  push:
    paths:
      - "src/struggler/bots/deep/**"
      - "scripts/build_deep_wasm.sh"
      - "scripts/deep_sync_census.py"
      - "tests/test_deep_*.py"
      - "third_party/deepstruggle"
      - ".gitmodules"
      - ".github/workflows/deep-engine.yml"
  pull_request:
    paths:
      - "src/struggler/bots/deep/**"
      - "scripts/build_deep_wasm.sh"
      - "third_party/deepstruggle"
      - ".github/workflows/deep-engine.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # third_party/deepstruggle only; its own submodule is not needed
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10           # DeepStruggle's pinned Emscripten (tools/scripts/install_emsdk.sh)
      - name: Build ts_engine.wasm
        run: scripts/build_deep_wasm.sh data/deep/ts_engine.wasm
      - name: Build the same shim natively, for the parity test
        run: DEEP_CXX=clang++ scripts/build_deep_wasm.sh data/deep/libdeep.so
      - uses: actions/upload-artifact@v4
        with:
          name: deep-engine
          path: |
            data/deep/ts_engine.wasm
            data/deep/libdeep.so

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deep-engine
          path: data/deep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,deep]"
      - name: Deep engine tests
        run: python -m pytest -q tests/test_deep_boundary.py tests/test_deep_backend.py
        env:
          STRUGGLER_DEEP_WASM: data/deep/ts_engine.wasm
          STRUGGLER_DEEP_SHARED_LIB: ${{ matrix.os == 'ubuntu-latest' && 'data/deep/libdeep.so' || '' }}
