<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Struggler</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div id="boardarea">
    <div id="boardwrap">
      <div id="boardbox">
        <img id="board" src="/assets/board.png" alt="board">
        <div id="markers"></div>
      </div>
    </div>
    <div id="zoomer">
      <button id="zoomout" title="Zoom out">−</button>
      <button id="zoomin" title="Zoom in">+</button>
      <button id="zoomfit" title="Fit to screen">Fit</button>
    </div>
  </div>
  <aside id="panel">
    <h1>Struggler</h1>
    <div id="status"></div>
    <div id="piles"></div>
    <div id="effects"></div>
    <div id="feed"></div>
  </aside>
</main>
<footer id="playbar">
  <div id="hand"></div>
  <div id="decision"></div>
</footer>
<div id="winner" hidden></div>
<script src="/app.js"></script>
</body>
</html>
