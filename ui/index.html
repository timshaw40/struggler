<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Struggler</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div id="leftcol">
    <div id="boardarea">
      <div id="boardwrap">
        <div id="boardbox">
          <img id="board" alt="Twilight Struggle board" draggable="false">
          <div id="boardload">
            <div class="loadinner">
              <p id="loadtext">Loading the board…</p>
              <div class="loadbar"><i></i></div>
            </div>
          </div>
          <div id="markers"></div>
        </div>
      </div>
      <div id="dicebox" hidden aria-live="polite">
        <p class="dtitle"></p>
        <div class="dice"></div>
        <p class="doutcome"></p>
      </div>
      <div id="actionbar" hidden></div>
      <div id="effectshud" hidden></div>
    </div>
    <div id="hand"></div>
  </div>
  <div id="colsplit" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Resize the log column" title="Drag to resize · double-click to reset"></div>
  <aside id="panel">
    <h1>Struggler<span class="hbtns">
      <button id="helpbtn" type="button" title="How to play (?)" aria-label="How to play">?</button>
      <button id="focusbtn" type="button" title="Map only (M)" aria-label="Map only">⛶</button>
      <button id="cog" type="button" title="Settings" aria-label="Settings" onclick="toggleSettings()">⚙</button>
    </span></h1>
    <div id="gamestatus"></div>
    <div id="settings" hidden></div>
    <div id="panelscroll">
      <div id="feedbar"></div>
      <div id="feed"></div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="piles"></div>
    </div>
    <div id="decision" hidden></div>
  </aside>
</main>
<aside id="help" hidden aria-label="How to play"></aside>
<div id="start" hidden role="dialog" aria-modal="true" aria-label="Start a new game">
  <div class="scard">
    <h2>New game</h2>
    <p class="ssub">Pick your side — the other seat is played by the bot.</p>
    <div class="ssides" role="radiogroup" aria-label="Your side">
      <label class="sside">
        <input type="radio" name="start-side" value="US">
        <span class="stext"><b>USA</b><span>you play second each turn</span></span>
      </label>
      <label class="sside">
        <input type="radio" name="start-side" value="USSR">
        <span class="stext"><b>CCCP</b><span>you play first each turn</span></span>
      </label>
    </div>
    <h3>Extra influence for the USA</h3>
    <p class="shint">The printed setup runs the USSR first, so the USA starts with a
      little extra. It applies whichever side you pick.</p>
    <div class="sextra">
      <input type="range" id="start-extra" min="0" max="6" step="1" value="2"
             aria-label="Extra USA setup influence">
      <b id="start-extra-n">+2</b>
    </div>
    <button type="button" id="startgo">Start game</button>
  </div>
</div>
<div id="winner" hidden role="dialog" aria-modal="true" aria-label="Game over"></div>
<div id="winnerchip" hidden>
  <button type="button" id="wchip">Game over — show summary</button>
</div>
<div id="toast" hidden></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
