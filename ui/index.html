<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Struggler</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div id="boardarea">
    <div id="boardwrap">
      <div id="boardbox">
        <img id="board" src="/assets/board.png" alt="board" draggable="false">
        <div id="markers"></div>
      </div>
    </div>
    <div id="dicebox" hidden>
      <p class="dtitle"></p>
      <div class="dice"></div>
      <p class="doutcome"></p>
    </div>
  </div>
  <aside id="panel">
    <h1>Struggler<button id="cog" type="button" title="Settings" onclick="toggleSettings()">⚙</button></h1>
    <div id="settings" hidden></div>
    <div id="panelscroll">
      <div id="feed"></div>
      <div id="status"></div>
      <div id="piles"></div>
      <div id="effects"></div>
    </div>
  </aside>
</main>
<footer id="playbar">
  <div id="decision" hidden></div>
  <div id="hand"></div>
</footer>
<div id="winner" hidden></div>
<div id="toast" hidden onclick="this.hidden = true"></div>
<script src="/app.js"></script>
</body>
</html>
