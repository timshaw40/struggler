<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Struggler</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <div id="leftcol">
    <div id="boardarea">
      <div id="boardwrap">
        <div id="boardbox">
          <img id="board" src="/assets/board.png" alt="Twilight Struggle board" draggable="false">
          <div id="boardload">Loading board…</div>
          <div id="markers"></div>
        </div>
      </div>
      <div id="dicebox" hidden aria-live="polite">
        <p class="dtitle"></p>
        <div class="dice"></div>
        <p class="doutcome"></p>
      </div>
      <div id="actionbar" hidden></div>
      <div id="effectshud" hidden></div>
    </div>
    <div id="hand"></div>
  </div>
  <aside id="panel">
    <h1>Struggler<button id="cog" type="button" title="Settings" aria-label="Settings" onclick="toggleSettings()">⚙</button></h1>
    <div id="gamestatus"></div>
    <div id="settings" hidden></div>
    <div id="panelscroll">
      <div id="feed"></div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="piles"></div>
    </div>
    <div id="decision" hidden></div>
  </aside>
</main>
<div id="winner" hidden role="dialog" aria-modal="true" aria-label="Game over"></div>
<div id="toast" hidden></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
